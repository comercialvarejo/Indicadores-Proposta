<style>
:root{
  color-scheme:light;
  --bg:#F3F4F2; --surface:#FFFFFF; --ink:#1E2624; --ink-2:#4A5753; --ink-3:#7B8784;
  --line:#DCE1DE; --line-2:#ECEFED;
  --brand:#DB3512; --brand-soft:#FCE6DF; --accent:#FC7200; --accent-soft:#FFEBD6;
  --ok:#2E7D5B; --ok-soft:#DFF1E8; --warn:#C25700; --warn-soft:#FFEBD6;
  --bar:#DB3512; --bar-2:#FC7200;
  --f-d:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;
    --bg:#121615; --surface:#1A201F; --ink:#E7ECEA; --ink-2:#B4BFBB; --ink-3:#7F8C88;
    --line:#2C3634; --line-2:#222A29;
    --brand:#F0582F; --brand-soft:#3A1C13; --accent:#FC7200; --accent-soft:#3A2410; --ok:#6FCB9F; --ok-soft:#173027; --warn:#FF9A3D; --warn-soft:#3A2410;
    --bar:#F0582F; --bar-2:#FC7200;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{background:#DB3512;color:#fff;border-bottom:4px solid #FC7200}
.top-in{max-width:1240px;margin:0 auto;padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:60px;height:60px;border-radius:14px;background:#fff;padding:4px;flex:none;box-shadow:0 0 0 2px #FC7200}
@media (max-width:520px){.logo{width:48px;height:48px;border-radius:11px}}
.drop .full{display:block;width:min(260px,70%);height:auto;margin:0 auto 14px;border-radius:12px;background:#fff;padding:10px}
.top h1{font-family:var(--f-d);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em}
.top p{margin:4px 0 0;font-size:14px;opacity:.85}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top .btn{background:#fff;color:#B02A0D;border-color:#fff}
.top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.top .btn.ghost:hover{background:rgba(255,255,255,.12)}
main{max-width:1240px;margin:0 auto;padding:20px}
.drop{border:2px dashed var(--line);border-radius:14px;background:var(--surface);padding:44px 20px;text-align:center;cursor:pointer}
.drop.on{border-color:var(--brand);background:var(--brand-soft)}
.drop h2{font-family:var(--f-d);font-size:26px;margin:0 0 6px}
.drop p{margin:0 auto;max-width:56ch;color:var(--ink-2)}
.fbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:0 0 16px}
.fbar label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fbar input,.fbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:150px}
.fbar .info{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.kpi{padding:14px 18px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:13px;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--ink-2)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line-2)}}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 18px 6px}
.ph h2{font-family:var(--f-d);font-size:22px;font-weight:700;margin:0}
.ph span{font-size:13px;color:var(--ink-3)}
.chart{padding:6px 12px 14px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:520px}
.chart text{font-family:var(--f-b);fill:var(--ink-3);font-size:11px}
.chart .val{fill:var(--ink-2);font-weight:600}
.chart .bar{fill:var(--bar)}
.chart .bar:hover{opacity:.8}
.chart .grid-l{stroke:var(--line-2)}
.rank{list-style:none;margin:0;padding:4px 18px 16px;counter-reset:r}
.rank li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.rank li:last-child{border-bottom:0}
.rank .pos{font-family:var(--f-d);font-weight:700;font-size:18px;color:var(--ink-3);text-align:right}
.rank li:nth-child(-n+3) .pos{color:var(--brand)}
.rank .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .n{font-family:var(--f-d);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.rank .track{grid-column:2/4;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--accent)}
.rank li:nth-child(-n+3) .track i{background:var(--brand)}
.rank .sub{grid-column:2/4;font-size:12px;color:var(--ink-3)}
.tbl{overflow-x:auto;padding:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.up{color:var(--ok);font-weight:600}.down{color:var(--warn);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:26px 18px;color:var(--ink-3);text-align:center}
.tsearch{padding:0 18px 10px;display:flex;gap:10px;flex-wrap:wrap}
.tsearch input{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.dist{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.dist span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-3)}
.dist b{color:var(--ink)}
.tsearch .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3)}
.tsearch input[type=checkbox]{flex:none;min-width:0;width:auto;padding:0;margin:0}
</style>
</head>

<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR');
const brl=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fh=h=>{if(h==null||!isFinite(h)) return '—';const m=Math.round(h*60);if(m<60) return m+' min';const hh=Math.floor(m/60),mm=m%60;if(hh<24) return hh+'h'+(mm?String(mm).padStart(2,'0'):'');return Math.floor(hh/24)+'d '+(hh%24)+'h';};
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dbr=k=>k.split('-').reverse().join('/');
const num=v=>{if(v==null||v==='') return null;if(typeof v==='number') return v;const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null;};
function toDate(v){
  if(v instanceof Date) return isNaN(v)?null:v;
  if(typeof v==='number'&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);return p?new Date(p.y,p.m-1,p.d,p.H,p.M,Math.floor(p.S)):null;}
  if(typeof v==='string'){const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));const d=new Date(v);return isNaN(d)?null:d;}
  return null;}
let tmr;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>el.hidden=true,3500);}

/* ---------- dados ---------- */
const KEY='indicadores-propostas-v1';
let D={props:{},itens:{},arquivos:[]};
let F={de:'',ate:'',vend:'',q:'',sort:{k:'dif',d:-1},qP:'',so:false,sortP:{k:'c',d:-1}};
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function carregar(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.props) D=o;}}catch(e){}}

function linhas(ws){const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});if(!a.length) return [];
  const h=a[0].map(x=>String(x??'').trim());return a.slice(1).filter(r=>r.some(c=>c!=null&&c!=='')).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return o;});}
const chaveP=(vend,n,ver,env)=>[String(vend||'').trim().toLowerCase(),n,ver||1,env?env.toISOString().slice(0,16):''].join('|');

function importar(wb,nome){
  const ps=wb.Sheets['Propostas'], is=wb.Sheets['Itens'];
  if(!ps) throw new Error('O arquivo '+nome+' não tem a aba "Propostas". Use o Excel baixado no painel de propostas.');
  let np=0,ni=0;
  for(const r of linhas(ps)){const env=toDate(r['Enviada em']);if(!env) continue;
    const k=chaveP(r['E-mail do vendedor']||r['Vendedor'],r['Proposta'],r['Versão'],env);
    if(!D.props[k]) np++;
    D.props[k]={k,n:r['Proposta'],ver:r['Versão']||1,vend:r['Vendedor']||r['E-mail do vendedor']||'Sem nome',email:r['E-mail do vendedor']||'',
      sup:r['Supervisor escolhido']||'',cli:r['Cliente']||'',env:env.toISOString(),st:r['Status']||'',apr:r['Respondido por']||'',
      ret:toDate(r['Retorno em'])?toDate(r['Retorno em']).toISOString():null,th:num(r['Tempo de resposta (h)']),kg:num(r['Kg'])||0,rs:num(r['Total pedido (R$)'])||0,rsC:num(r['Total da contraproposta (R$)'])};}
  if(is){
    // remove itens antigos das propostas deste arquivo para não duplicar
    const vistos=new Set();
    for(const r of linhas(is)){const env=toDate(r['Enviada em']);if(!env) continue;
      const kp=chaveP(r['Vendedor'],r['Proposta'],r['Versão'],env);
      const prop=D.props[kp]||Object.values(D.props).find(p=>p.n==r['Proposta']&&p.vend===r['Vendedor']&&p.env.slice(0,16)===env.toISOString().slice(0,16));
      const kpp=prop?prop.k:kp;
      if(!vistos.has(kpp)){for(const k of Object.keys(D.itens)) if(D.itens[k].kp===kpp) delete D.itens[k]; vistos.add(kpp);}
      const k=kpp+'#'+(ni++);
      D.itens[k]={kp:kpp,n:r['Proposta'],vend:r['Vendedor']||'',cli:r['Cliente']||'',env:env.toISOString(),st:r['Status']||'',prod:r['Produto']||'',
        kg:num(r['Kg'])||0,cx:num(r['Caixas']),pr:num(r['Preço (R$/kg)']),cp:num(r['Contraproposta (R$/kg)']),apr:r['Respondido por']||''};}
  }
  D.arquivos.push({nome,em:new Date().toISOString()});
  return np;
}
async function lerArquivos(files){
  if(!window.XLSX){toast('Não foi possível carregar o leitor de Excel. Confira a internet e recarregue a página.');return;}
  let novos=0,ok=0;
  for(const f of files){try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});novos+=importar(wb,f.name);ok++;}
    catch(e){toast(e.message&&e.message.startsWith('O arquivo')?e.message:'Não consegui ler '+f.name+'.');console.warn(e);}}
  if(ok){salvar();render();toast(ok+(ok>1?' arquivos carregados':' arquivo carregado')+' · '+novos+(novos===1?' proposta nova':' propostas novas')+'.');}
}

/* ---------- filtros ---------- */
function filtradas(){
  const de=F.de?new Date(F.de+'T00:00:00'):null, ate=F.ate?new Date(F.ate+'T23:59:59.999'):null;
  const ok=p=>{const t=new Date(p.env);if(de&&t<de) return false;if(ate&&t>ate) return false;if(F.vend&&p.vend!==F.vend) return false;return true;};
  return {P:Object.values(D.props).filter(ok),I:Object.values(D.itens).filter(ok)};
}

/* ---------- desenho ---------- */
function graficoDia(P){
  if(!P.length) return '<div class="empty">Nenhuma proposta no período.</div>';
  const cont=new Map();for(const p of P){const k=dkey(new Date(p.env));cont.set(k,(cont.get(k)||0)+1);}
  const ks=[...cont.keys()].sort();const ini=new Date(ks[0]+'T12:00:00'),fim=new Date(ks[ks.length-1]+'T12:00:00');
  const dias=[];for(let d=new Date(ini);d<=fim;d.setDate(d.getDate()+1)) dias.push(dkey(d));
  const W=Math.max(560,dias.length*34),H=240,pl=34,pr=10,pt=18,pb=40,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...dias.map(k=>cont.get(k)||0),1);const step=max<=5?1:Math.ceil(max/5);const top=Math.ceil(max/step)*step;
  const bw=iw/dias.length,gap=Math.min(10,bw*.28);const every=Math.ceil(dias.length/16);
  let g='';for(let v=0;v<=top;v+=step){const y=pt+ih-ih*v/top;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`;}
  const sem=['dom','seg','ter','qua','qui','sex','sáb'];
  const bars=dias.map((k,i)=>{const v=cont.get(k)||0,h=ih*v/top,x=pl+i*bw+gap/2,y=pt+ih-h,d=new Date(k+'T12:00:00');
    return `<g><rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="3"><title>${dbr(k)}: ${v} ${v===1?'proposta':'propostas'}</title></rect>
      ${v?`<text class="val" x="${(x+(bw-gap)/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${v}</text>`:''}
      ${i%every===0?`<text x="${(x+(bw-gap)/2).toFixed(1)}" y="${H-pb+16}" text-anchor="middle">${k.slice(8)}/${k.slice(5,7)}</text><text x="${(x+(bw-gap)/2).toFixed(1)}" y="${H-pb+30}" text-anchor="middle">${sem[d.getDay()]}</text>`:''}</g>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Propostas enviadas por dia">${g}${bars}</svg>`;
}
function ranking(P){
  const m=new Map();for(const p of P){const o=m.get(p.vend)||{n:0,ap:0,ct:0,rs:0};o.n++;o.rs+=p.rs;if(/^aprovada/i.test(p.st)) o.ap++;if(/contraproposta/i.test(p.st)) o.ct++;m.set(p.vend,o);}
  const arr=[...m.entries()].sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0]));
  if(!arr.length) return '<div class="empty">Nenhum vendedor no período.</div>';
  const max=arr[0][1].n;
  return `<ol class="rank">${arr.map(([v,o],i)=>`<li><span class="pos">${i+1}</span><span class="nm" title="${esc(v)}">${esc(v)}</span><span class="n">${o.n}</span>
    <span class="track"><i style="width:${(o.n/max*100).toFixed(1)}%"></i></span><span class="sub">${o.ap} aprovadas · ${o.ct} com contraproposta · ${brl(o.rs)}</span></li>`).join('')}</ol>`;
}
function corrigidos(I){
  let rows=I.filter(i=>i.cp!=null&&i.pr!=null&&Math.abs(i.cp-i.pr)>0.0001).map(i=>({...i,dif:i.cp-i.pr,difp:i.pr?(i.cp-i.pr)/i.pr*100:0,imp:(i.cp-i.pr)*i.kg}));
  if(F.q){const q=F.q.toLowerCase();rows=rows.filter(i=>[i.prod,i.vend,i.cli,i.apr].join(' ').toLowerCase().includes(q));}
  const {k,d}=F.sort;rows.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='string'?String(x).localeCompare(y):(x??0)-(y??0))*d;});
  return rows;
}
const ehCorr=i=>i.cp!=null&&i.pr!=null&&Math.abs(i.cp-i.pr)>0.0001;
const COLS_TXT=['env','vend','cli','st','apr'];
function itensPorProposta(P,I){
  const m=new Map();
  for(const i of I){const o=m.get(i.kp)||{t:0,c:0};o.t++;if(ehCorr(i)) o.c++;m.set(i.kp,o);}
  return P.map(p=>{const o=m.get(p.k)||{t:0,c:0};return {...p,t:o.t,c:o.c,pc:o.t?o.c/o.t*100:0};});
}
function propRows(){

  const {k,d}=F.sortP;rows.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='string'?String(x).localeCompare(y):(x??0)-(y??0))*d;});
  return rows;
}

    <p>No painel Propostas &amp; Retorno, vá em Aprovar › Resumo e histórico e clique em Baixar Excel. Depois arraste o arquivo para cá ou clique para escolher. Dá para carregar vários de uma vez, um por semana: as propostas repetidas são juntadas.</p></div>`;return;}
  const {P,I}=filtradas(); const vends=[...new Set(Object.values(D.props).map(p=>p.vend))].sort();
  const resp=P.filter(p=>p.th!=null); const tm=resp.length?resp.reduce((s,p)=>s+p.th,0)/resp.length:null;
  const corr=corrigidos(I); const nCorr=I.filter(ehCorr).length; const propsCorr=new Set(I.filter(i=>i.cp!=null&&i.pr!=null&&Math.abs(i.cp-i.pr)>0.0001).map(i=>i.kp)).size;
  const dias=new Set(P.map(p=>dkey(new Date(p.env)))).size;
  const all=Object.values(D.props).map(p=>p.env).sort();
  app.innerHTML=`
  <div class="fbar">
    <label>De<input type="date" id="fDe" value="${esc(F.de)}"></label>
    <label>Até<input type="date" id="fAte" value="${esc(F.ate)}"></label>
    <label>Vendedor<select id="fVend"><option value="">Todos</option>${vends.map(v=>`<option ${F.vend===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>
    ${F.de||F.ate||F.vend?'<button class="btn" id="btnLimpa">Limpar filtros</button>':''}
    <div class="info">${nf.format(tem)} propostas na base, de ${new Date(all[0]).toLocaleDateString('pt-BR')} a ${new Date(all[all.length-1]).toLocaleDateString('pt-BR')}<br>${D.arquivos.length} ${D.arquivos.length===1?'arquivo carregado':'arquivos carregados'}</div>
  </div>

    <div class="kpi"><div class="k">Vendedores que enviaram</div><div class="v">${new Set(P.map(p=>p.vend)).size}</div><div class="s">${brl(P.reduce((s,p)=>s+p.rs,0))} pedidos</div></div>
    <div class="kpi"><div class="k">Itens corrigidos pelo aprovador</div><div class="v">${nf.format(nCorr)}</div><div class="s">em ${propsCorr} ${propsCorr===1?'proposta':'propostas'}${propsCorr?' · média de '+(nCorr/propsCorr).toFixed(1).replace('.',',')+' por proposta':''}<br>de ${nf.format(I.length)} ${I.length===1?'item enviado':'itens enviados'}${I.length?' ('+Math.round(nCorr/I.length*100)+'%)':''}</div></div>

    <section class="panel"><div class="ph"><h2>Ranking de vendedores</h2><span>por propostas enviadas</span></div>${ranking(P)}</section>
  </div>

      return `<span><b>${n(r=>r.c===0)}</b> sem correção</span><span><b>${n(r=>r.c===1)}</b> com 1 item corrigido</span><span><b>${n(r=>r.c===2)}</b> com 2 itens</span><span><b>${n(r=>r.c>=3)}</b> com 3 ou mais</span>${sem?`<span><b>${sem}</b> sem detalhe de itens</span>`:''}`;})()}</div>

    <div id="tProp">${tabelaProp(propRows())}</div></section>
  <section class="panel"><div class="ph"><h2>Itens corrigidos pelo aprovador</h2><span>preço da contraproposta diferente do pedido · clique no título da coluna para ordenar</span></div>
    <div class="tsearch"><input type="search" id="fQ" placeholder="Buscar produto, vendedor, cliente ou aprovador" value="${esc(F.q)}" aria-label="Buscar nos itens corrigidos"></div>
    <div id="tCorr">${tabelaCorr(corr)}</div></section>`;
}

/* ---------- base acumulada ---------- */
function baixarBase(){
  const P=Object.values(D.props).sort((a,b)=>a.env.localeCompare(b.env));const I=Object.values(D.itens).sort((a,b)=>a.env.localeCompare(b.env));
  const wb=XLSX.utils.book_new();
  const p=[['Proposta','Versão','Vendedor','E-mail do vendedor','Supervisor escolhido','Cliente','Enviada em','Status','Respondido por','Retorno em','Tempo de resposta (h)','Kg','Total pedido (R$)','Total da contraproposta (R$)'],
    ...P.map(x=>[x.n,x.ver,x.vend,x.email,x.sup,x.cli,new Date(x.env),x.st,x.apr,x.ret?new Date(x.ret):null,x.th,x.kg,x.rs,x.rsC])];
  const i=[['Proposta','Vendedor','Cliente','Enviada em','Status','Produto','Kg','Caixas','Preço (R$/kg)','Contraproposta (R$/kg)','Respondido por'],
    ...I.map(x=>[x.n,x.vend,x.cli,new Date(x.env),x.st,x.prod,x.kg,x.cx,x.pr,x.cp,x.apr])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(p,{cellDates:true,dateNF:'dd/mm/yyyy hh:mm'}),'Propostas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(i,{cellDates:true,dateNF:'dd/mm/yyyy hh:mm'}),'Itens');
  XLSX.writeFile(wb,'Base-acumulada-propostas.xlsx',{compression:true});
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#btnAbrir')||t.closest('#drop')){$('#arq').click();return;}
  if(t.closest('#btnBase')){baixarBase();return;}
  if(t.closest('#btnZerar')){if(confirm('Apagar todos os dados carregados neste navegador? Os arquivos Excel não são afetados.')){D={props:{},itens:{},arquivos:[]};salvar();render();}return;}
  if(t.closest('#btnLimpa')){F.de='';F.ate='';F.vend='';render();return;}
  const thp=t.closest('th[data-sortp]');if(thp){const k=thp.dataset.sortp;F.sortP=F.sortP.k===k?{k,d:-F.sortP.d}:{k,d:COLS_TXT.includes(k)?1:-1};$('#tProp').innerHTML=tabelaProp(propRows());return;}
  const th=t.closest('th[data-sort]');if(th){const k=th.dataset.sort;F.sort=F.sort.k===k?{k,d:-F.sort.d}:{k,d:typeof ({env:1,vend:1,cli:1,prod:1,apr:1,st:1})[k]==='number'?1:-1};$('#tCorr').innerHTML=tabelaCorr(corrigidos(filtradas().I));}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='drop'){e.preventDefault();$('#arq').click();}});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='arq'){lerArquivos([...e.target.files]);e.target.value='';}
  if(id==='fSo'){F.so=e.target.checked;$('#tProp').innerHTML=tabelaProp(propRows());}
  if(id==='fDe'){F.de=e.target.value;render();} if(id==='fAte'){F.ate=e.target.value;render();} if(id==='fVend'){F.vend=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='fQP'){F.qP=e.target.value;$('#tProp').innerHTML=tabelaProp(propRows());}
  if(e.target.id==='fQ'){F.q=e.target.value;$('#tCorr').innerHTML=tabelaCorr(corrigidos(filtradas().I));}});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();const d=$('#drop');if(d) d.classList.add('on');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();const d=$('#drop');if(d) d.classList.remove('on');}));
document.addEventListener('drop',e=>{const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])].filter(f=>/\.xlsx?$/i.test(f.name));if(fs.length) lerArquivos(fs);});

carregar(); render();
</script>
